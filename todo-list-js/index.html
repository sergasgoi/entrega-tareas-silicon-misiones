<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Tareas — TP Clase 13 (DOM)</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #F1F2F2;
            color: #20203A;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }

        .app {
            background: #fff;
            width: 100%;
            max-width: 440px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(43, 41, 109, 0.12);
            padding: 26px;
        }

        h1 {
            color: #2B296D;
            font-size: 22px;
            margin: 0 0 4px;
        }

        .sub {
            color: #6E6E80;
            font-size: 13px;
            margin: 0 0 20px;
        }

        .fila {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        #nuevaTarea {
            flex: 1;
            padding: 11px 12px;
            border: 1.5px solid #CFD0DA;
            border-radius: 8px;
            font-size: 15px;
        }

        #nuevaTarea:focus {
            outline: none;
            border-color: #0E6689;
        }

        #agregar {
            background: #0E6689;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        #agregar:hover {
            background: #0b4f68;
        }

        .borrar {
            background: #0E6689;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 26%;
            margin-bottom: 8px;
        }

        .borrar:hover {
            background: #0b4f68;
        }

        #lista {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;

        }

        #lista li {
            background: #F7F7FA;
            border: 1px solid #E7E7EE;
            border-radius: 8px;
            padding: 11px 12px;
            margin-bottom: 8px;
            font-size: 15px;
            cursor: pointer;
            width: 70%;
        }

        #lista li.hecha {
            text-decoration: line-through;
            color: #9A9AAB;
            background: #EFEFF3;
        }

        #pie {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }

        #contador {
            color: #2B296D;
            font-weight: 600;
            font-size: 14px;
            margin-top: 16px;
            width: 20%;
        }

        #error {
            color: #2B296D;
            font-weight: 600;
            font-size: 14px;
            margin-top: 16px;
            width: 78%;
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>Mi Lista de Tareas</h1>
        <p class="sub">TP Clase 13 · El DOM</p>

        <div class="fila">
            <input id="nuevaTarea" type="text" placeholder="Escribí una tarea..." />
            <button id="agregar">Agregar</button>
        </div>

        <ul id="lista"></ul>

        <div id="pie">
            <p id="contador">Tareas: 0</p>
            <p id="error"></p>
        </div>
    </div>
</body>
<script>
    let input = document.querySelector("#nuevaTarea");
    let boton = document.querySelector("#agregar");
    let lista = document.querySelector("#lista");
    let contador = document.querySelector("#contador");
    let error = document.querySelector("#error");

    function actualizarContador() {
        contador.textContent = "Tareas: " + (lista.children.length / 2);
    }

    boton.addEventListener("click", function () {

        let texto = input.value;

        if (texto == "") {
            return (
                error.textContent = "Error: Ingresar una Tarea."
            );
        }
        let li = document.createElement("li");
        let borrar = document.createElement("button");
        li.textContent = texto;
        lista.appendChild(li);

        lista.appendChild(borrar);
        borrar.classList.add("borrar");
        borrar.textContent = "Borrar";
        borrar.addEventListener("click", function () {
            li.remove();
            borrar.remove();
            error.textContent = "";
            input.value = "";
            actualizarContador();

        });

        li.addEventListener("click", function () {
            li.classList.toggle("hecha");
            error.textContent = "";
            input.value = "";
        });

        error.textContent = "";
        input.value = "";
        actualizarContador();
    });

    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") boton.click();
    });
</script>

</html>
