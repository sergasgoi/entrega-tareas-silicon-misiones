<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP N°2 Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>TP N°2 Character Counter</h1>

        <div class="cantidadMaxima">
            <label for="maximo">Cantidad máxima:</label>
            <input type="number" id="maximo" value="200" min="1">
            <button id="limpiar">Limpiar</button>
        </div>

        <textarea placeholder="Escriba un Texto" id="texto"></textarea>

        <div class="barra">
            <div id="progreso"></div>
        </div>

        <div class="contenedor">
            <div class="fila">
                <h3>Caracteres <span id="caracteres">0</span></h3>
            </div>

            <div class="fila">
                <h3>Palabras <span id="palabras">0</span></h3>
            </div>

            <div class="fila">
                <h3>Sin Espacios <span id="sinEspacios">0</span></h3>
            </div>

            <div class="fila">
                <h3>Restantes <span id="restantes">200</span></h3>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
